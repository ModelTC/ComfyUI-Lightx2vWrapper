name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    name: Ruff and repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run checks
        run: pre-commit run --all-files
